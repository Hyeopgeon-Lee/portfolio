name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 22 * * *' # Every day 07:20 Asia/Seoul

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for YouTube verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate official-feed parser
        run: node tests/youtube-feed.test.mjs
      - name: Install YouTube metadata client
        run: python -m pip install --disable-pip-version-check "yt-dlp[default]"
      - name: Synchronize official channel and classify 2026 videos
        run: node scripts/sync-youtube-2026.mjs
      - name: Generate search pages and sitemaps
        run: node scripts/generate-seo.mjs
      - name: Verify search metadata
        run: node scripts/check-seo.mjs
      - name: Preserve validated YouTube inventory in repository
        shell: bash
        run: |
          git add data/showcase-videos.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync verified 2026 project and graduation YouTube videos [skip ci]"
            git push || echo "Unable to persist synchronized data; current Pages build still uses validated videos."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_HOST: portfolio.k-bigdata.kr
      INDEXNOW_KEY: 772afcaf303b4ab6b0e9d17d1d8eb864
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for YouTube verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate current sitemap
        run: |
          python -m pip install --disable-pip-version-check "yt-dlp[default]"
          node scripts/sync-youtube-2026.mjs
          node scripts/generate-seo.mjs
      - name: Wait for the IndexNow key to be published
        shell: bash
        run: |
          set -euo pipefail
          key_url="https://${SITE_HOST}/${INDEXNOW_KEY}.txt"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "$key_url" | grep --fixed-strings --line-regexp "$INDEXNOW_KEY"; then
              exit 0
            fi
            sleep 10
          done
          echo "IndexNow key was not available at $key_url" >&2
          exit 1
      - name: Notify IndexNow about sitemap URLs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t urls < <(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' sitemap.xml)
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No URLs were found in sitemap.xml" >&2
            exit 1
          fi
          url_json=$(printf '%s\n' "${urls[@]}" | jq --raw-input . | jq --slurp .)
          jq --null-input \
            --arg host "$SITE_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://${SITE_HOST}/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$url_json" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}' \
            > indexnow-payload.json
          for attempt in {1..6}; do
            status=$(curl --silent --show-error \
              --output indexnow-response.txt \
              --write-out '%{http_code}' \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data-binary @indexnow-payload.json \
              https://api.indexnow.org/indexnow)
            if [ "$status" = "200" ] || [ "$status" = "202" ]; then
              echo "IndexNow accepted ${#urls[@]} URLs with HTTP $status."
              exit 0
            fi
            if [ "$status" = "429" ] || [[ "$status" =~ ^5 ]]; then
              sleep $((attempt * 10))
              continue
            fi
            echo "IndexNow returned HTTP $status" >&2
            cat indexnow-response.txt >&2
            exit 1
          done
          echo "IndexNow did not accept the URLs after 6 attempts (last HTTP $status)." >&2
          cat indexnow-response.txt >&2
          exit 1
